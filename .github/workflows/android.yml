name: Build BAZR Inspector Android (debug)
on:
  push:
    paths:
      - 'android-native/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Check staging API URL
        env:
          BAZR_API_BASE_URL: ${{ vars.BAZR_API_BASE_URL }}
        shell: bash
        run: |
          if [[ "$BAZR_API_BASE_URL" != https://* || "$BAZR_API_BASE_URL" != */ ]]; then
            echo 'Set repository variable BAZR_API_BASE_URL to the complete HTTPS API URL, ending with /'
            exit 1
          fi
      - name: Compile inspector APK
        env:
          BAZR_API_BASE_URL: ${{ vars.BAZR_API_BASE_URL }}
        working-directory: android-native
        run: gradle :app:assembleDebug -PBAZR_API_BASE_URL="$BAZR_API_BASE_URL"
      - uses: actions/upload-artifact@v4
        with:
          name: bazr-inspector-debug
          path: android-native/app/build/outputs/apk/debug/*.apk
